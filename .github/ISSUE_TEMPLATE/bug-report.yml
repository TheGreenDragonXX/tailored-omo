name: Bug report
description: Report a reproducible bug in tailored-omo.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Keep it short, but include enough detail for us to reproduce it.

        Before filing, restart OpenCode and run `tailored-omo doctor`. If the
        problem remains, include the diagnostic result below with secrets and
        machine-specific paths removed.
  - type: textarea
    id: summary
    attributes:
      label: What happened, and what did you expect?
      description: Describe the bug and the expected behavior.
      placeholder: |
        What happened: The plugin crashes when I run...
        Expected: It should...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Share the smallest repro you can.
      placeholder: |
        1. Run...
        2. Open...
        3. See...
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: tailored-omo.json
      description: Paste your tailored-omo.json config with secrets removed.
      render: jsonc
    validations:
      required: false
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      placeholder: Output of opencode --version
    validations:
      required: false
  - type: input
    id: plugin-version
    attributes:
      label: tailored-omo version
      placeholder: Commit or package version
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4 / Ubuntu 24.04 / Windows 11
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or extra context
      description: Add anything else that may help us reproduce or understand the bug.
      render: shell
    validations:
      required: false
